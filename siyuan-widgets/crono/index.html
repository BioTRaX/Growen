<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crono</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h2>Crono</h2>
            <div class="controls">
                <input type="text" id="av-id" value="20260828101028-w717hlz" placeholder="ID del AV" title="ID de la base de datos (Attribute View) de SiYuan" />

    <script src="script.js"></script>
