# NG-HEADER: Nombre de archivo: security-headers.conf
# NG-HEADER: Ubicación: infra/nginx/security-headers.conf
# NG-HEADER: Descripción: Cabeceras defensivas compartidas por las respuestas HTTPS de Nginx.
# NG-HEADER: Lineamientos: Ver AGENTS.md

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
