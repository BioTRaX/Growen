# NG-HEADER: Nombre de archivo: docker-compose.yml
# NG-HEADER: Ubicación: docker-compose.yml
# NG-HEADER: Descripción: Orquestación de servicios locales mediante Docker Compose.
# NG-HEADER: Lineamientos: Ver AGENTS.md
services:
  db:
    container_name: growen-postgres
    image: growen/postgres:pgvector
    build:
      context: .
      dockerfile: infra/Dockerfile.postgres
    environment:
      # Usar variables desde .env (no commitear credenciales)
      POSTGRES_USER: ${POSTGRES_USER:-growen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-growen}
    ports:
      # Nota: en Windows a veces hay un Postgres local en 5432. Mapeamos a 5433 para evitar colisiones.
      # Bind a localhost para prevenir acceso externo en entornos sin firewall.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
      # Docker Engine no publica puertos de contenedores conectados solo a una
      # red internal. Esta red conserva el acceso local 127.0.0.1:5433.
      - host_access
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    env_file: .env
    environment:
      # Importante: dentro del contenedor NO usar 127.0.0.1:5433; usar el servicio 'db:5432'.
      # Forzamos DB_URL vacío para que settings construya la URL desde host/puerto/credenciales.
      DB_URL: ""
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-growen}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-growen}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_HOST: ${OLLAMA_HOST_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      AI_MODE: ${AI_MODE:-ollama}
      AI_ALLOW_EXTERNAL: ${AI_ALLOW_EXTERNAL:-false}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE_DOCKER:-}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-ollama}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-qwen3-embedding:4b}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/growen/telegram_bot_token
      TELEGRAM_IDENTITY_ENCRYPTION_KEY_FILE: /run/secrets/growen/telegram_identity_encryption_key
      TELEGRAM_IDENTITY_HMAC_KEY_FILE: /run/secrets/growen/telegram_identity_hmac_key
      PGCONNECT_TIMEOUT: ${PGCONNECT_TIMEOUT:-5}
      # Enriquecimiento IA con búsqueda web (MCP)
      AI_USE_WEB_SEARCH: "0"
      MCP_PRODUCTS_URL: "http://mcp_products:8100/mcp"
      MCP_WEB_SEARCH_URL: "http://mcp_web_search:8002/mcp"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - redis
    command: ["/app/infra/wait-for.sh", "db:5432", "uvicorn", "services.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Consolidar logs del backend en la carpeta del host
      - ./logs:/app/logs
      # Carpeta de documentos de conocimiento para RAG
      - ./Conocimientos:/app/Conocimientos
      - type: bind
        source: ${GROWEN_SECRET_DIR:-../growen-secrets}
        target: /run/secrets/growen
        read_only: true
    # Configurar logging de Docker para escribir en logs/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - backend
      - egress
      - host_access
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    container_name: growen-frontend
    image: growen/frontend:${FRONTEND_IMAGE_TAG:-current}
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    environment:
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-25m}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - backend
      - host_access
  pdf_import:
    image: alpine:3.19
    command: ["sh","-c","sleep infinity"]
    profiles: ["optional"]
  playwright:
    image: alpine:3.19
    command: ["sh","-c","sleep infinity"]
    profiles: ["optional"]
  image_processing:
    image: alpine:3.19
    command: ["sh","-c","sleep infinity"]
    profiles: ["optional"]
  redis:
    image: redis:7-alpine
    container_name: growen-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - backend
      # Requerida por la API y los workers ejecutados localmente.
      - host_access
  telegram_worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.telegram-worker
    container_name: growen-telegram-worker
    env_file: .env
    environment:
      DB_URL: ""
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-growen}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-growen}
      REDIS_URL: redis://redis:6379/0
      CHAT_RATE_LIMIT_BACKEND: redis
      TELEGRAM_RATE_LIMIT_REDIS_PREFIX: ${TELEGRAM_RATE_LIMIT_REDIS_PREFIX:-growen:telegram:rate}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/growen/telegram_bot_token
      TELEGRAM_IDENTITY_ENCRYPTION_KEY_FILE: /run/secrets/growen/telegram_identity_encryption_key
      TELEGRAM_IDENTITY_HMAC_KEY_FILE: /run/secrets/growen/telegram_identity_hmac_key
      TELEGRAM_CANARY_USER_ID_FILE: /run/secrets/growen/telegram_canary_user_id
      OLLAMA_HOST: ${OLLAMA_HOST_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      AI_MODE: ollama
      AI_ALLOW_EXTERNAL: "false"
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE_DOCKER:-}
      RAG_EMBEDDING_PROVIDER: ollama
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-qwen3-embedding:4b}
      RAG_EMBEDDING_DIMENSIONS: "1536"
    depends_on:
      - db
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - type: bind
        source: ${GROWEN_SECRET_DIR:-../growen-secrets}
        target: /run/secrets/growen
        read_only: true
    restart: unless-stopped
    profiles: ["telegram"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - egress
      - host_access
  chat_rollout_controller:
    build:
      context: .
      dockerfile: infra/Dockerfile.telegram-worker
    container_name: growen-chat-rollout
    env_file: .env
    environment:
      DB_URL: ""
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-growen}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-growen}
      CHAT_ROLLOUT_INTERVAL_SECONDS: ${CHAT_ROLLOUT_INTERVAL_SECONDS:-300}
      TELEGRAM_POLLING_QUEUE_SIZE: ${TELEGRAM_POLLING_QUEUE_SIZE:-100}
    depends_on:
      - db
    command: ["python", "workers/chat_rollout.py"]
    restart: unless-stopped
    profiles: ["telegram"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./logs:/app/logs:ro
    networks:
      - backend
  dramatiq:
    build:
      context: .
      dockerfile: infra/Dockerfile.dramatiq
    container_name: growen-dramatiq
    env_file: .env
    environment:
      # Importante: dentro del contenedor usar el servicio 'db:5432' y 'redis:6379'
      DB_URL: ""
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-growen}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-growen}
      REDIS_URL: redis://redis:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /app/certs/growen-drive.json
    depends_on:
      - db
      - redis
    volumes:
      # Código fuente para hot-reload en desarrollo
      - ./:/app
      # Consolidar logs del worker en la carpeta del host
      - ./logs:/app/logs
      # Carpeta de certificados (solo lectura para credenciales)
      - ./certs:/app/certs:ro
    restart: unless-stopped
    profiles: ["optional"]
    # Hot-reload: watchmedo reinicia el worker al detectar cambios en *.py
    command: >
      watchmedo auto-restart
      --directory=./services
      --pattern=*.py
      --recursive
      --
      python -m dramatiq services.jobs.drive_sync services.jobs.catalog_jobs --processes 1 --threads 1 --queues drive_sync catalog
    # Configurar logging de Docker para escribir en logs/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - backend
      - egress
  market_worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.market-worker
    container_name: growen-market-worker
    env_file: .env
    environment:
      DB_URL: ""
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-growen}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-growen}
      REDIS_URL: redis://redis:6379/0
      MARKET_HEARTBEAT_ENABLED: "1"
      MARKET_CONCURRENCY: ${MARKET_CONCURRENCY:-4}
      MARKET_PRICE_FRESHNESS_DAYS: ${MARKET_PRICE_FRESHNESS_DAYS:-7}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    depends_on:
      - db
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    profiles: ["optional"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - backend
      - egress
  enrichment_worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.dramatiq
    container_name: growen-enrichment-worker
    env_file: .env
    environment:
      DB_URL: ""
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-growen}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-growen}
      REDIS_URL: redis://redis:6379/0
      MCP_WEB_SEARCH_URL: ${ENRICH_MCP_WEB_SEARCH_URL:-http://mcp_web_search:8002/mcp}
      OLLAMA_HOST: ${OLLAMA_HOST_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      ENRICHMENT_HEARTBEAT_ENABLED: "1"
      ENRICHMENT_HEARTBEAT_TTL_SECONDS: ${ENRICHMENT_HEARTBEAT_TTL_SECONDS:-60}
    depends_on:
      - db
      - redis
      - mcp_web_search
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    profiles: ["optional"]
    command:
      - python
      - -m
      - dramatiq
      - services.jobs.enrichment_jobs
      - --processes
      - "1"
      - --threads
      - "${ENRICHMENT_CONCURRENCY:-2}"
      - --queues
      - enrichment
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - backend
      - egress
      - host_access
  knowledge_worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.dramatiq
    container_name: growen-knowledge-worker
    env_file: .env
    environment:
      DB_URL: ""
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-growen}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-growen}
      REDIS_URL: redis://redis:6379/0
      MCP_WEB_SEARCH_URL: ${KNOWLEDGE_MCP_WEB_SEARCH_URL:-http://mcp_web_search:8002/mcp}
      KNOWLEDGE_HEARTBEAT_ENABLED: "1"
      KNOWLEDGE_HEARTBEAT_TTL_SECONDS: ${KNOWLEDGE_HEARTBEAT_TTL_SECONDS:-60}
      MEDIA_ROOT: /app/media
    depends_on:
      - db
      - redis
      - mcp_web_search
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./Devs/Imagenes:/app/media
    restart: unless-stopped
    profiles: ["optional"]
    command:
      - python
      - -m
      - dramatiq
      - services.jobs.knowledge_jobs
      - --processes
      - "1"
      - --threads
      - "${KNOWLEDGE_CONCURRENCY:-1}"
      - --queues
      - canonical_knowledge
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - backend
      - egress
  scheduler:
    image: alpine:3.19
    command: ["sh","-c","sleep infinity"]
    profiles: ["optional"]
  tiendanube:
    image: alpine:3.19
    command: ["sh","-c","sleep infinity"]
    profiles: ["optional"]
  notifier:
    image: alpine:3.19
    command: ["sh","-c","sleep infinity"]
    profiles: ["optional"]
  mcp_products:
    build:
      context: .
      dockerfile: mcp_servers/products_server/Dockerfile
    container_name: growen-mcp-products
    depends_on:
      - api
      - redis
    environment:
      # En Compose, Products consume siempre la API por el nombre de servicio.
      # start-dev.ps1 configura 127.0.0.1 cuando ambos procesos corren locales.
      API_BASE_URL: http://api:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      INTERNAL_SERVICE_NAME: mcp-products
      # Seguridad JWT (debe coincidir con el backend que genera los tokens)
      MCP_SECRET_KEY: ${MCP_PRODUCTS_SECRET_KEY}
      MCP_SECRET_KEY_PREVIOUS: ${MCP_PRODUCTS_SECRET_KEY_PREVIOUS:-}
      MCP_JWT_KEY_ID: ${MCP_PRODUCTS_KEY_ID:-products-v1}
      MCP_JWT_PREVIOUS_KEY_ID: ${MCP_PRODUCTS_PREVIOUS_KEY_ID:-}
      MCP_JWT_AUDIENCE: ${MCP_PRODUCTS_JWT_AUDIENCE:-growen-mcp-products}
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-60}
      MCP_RATE_LIMIT_BACKEND: redis
      MCP_TOKEN_REVOCATION_BACKEND: redis
      MCP_RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      MCP_JWT_MAX_TTL_SECONDS: ${MCP_JWT_MAX_TTL_SECONDS:-600}
      MCP_JWT_ISSUER: ${MCP_JWT_ISSUER:-growen-api}
      MCP_PROTOCOL_VERSION: ${MCP_PROTOCOL_VERSION:-2025-11-25}
      MCP_LEGACY_RPC_ENABLED: ${MCP_LEGACY_RPC_ENABLED:-0}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      WEB_FETCH_ENABLED: ${WEB_FETCH_ENABLED:-1}
      WEB_FETCH_MAX_HTML_BYTES: ${WEB_FETCH_MAX_HTML_BYTES:-2000000}
      WEB_FETCH_MAX_PDF_BYTES: ${WEB_FETCH_MAX_PDF_BYTES:-10000000}
      WEB_FETCH_MAX_TEXT_CHARS: ${WEB_FETCH_MAX_TEXT_CHARS:-50000}
      WEB_FETCH_TIMEOUT_SECONDS: ${WEB_FETCH_TIMEOUT_SECONDS:-12}
      WEB_FETCH_MAX_REDIRECTS: ${WEB_FETCH_MAX_REDIRECTS:-3}
      WEB_FETCH_CACHE_TTL_SECONDS: ${WEB_FETCH_CACHE_TTL_SECONDS:-86400}
      WEB_FETCH_ALLOWED_MIME: ${WEB_FETCH_ALLOWED_MIME:-text/html,application/pdf}
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8100:8100"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
  mcp_web_search:
    build:
      context: .
      dockerfile: mcp_servers/web_search_server/Dockerfile
    container_name: growen-mcp-web-search
    depends_on:
      - api
      - redis
    environment:
      LOG_LEVEL: info
      MCP_SECRET_KEY: ${MCP_WEB_SEARCH_SECRET_KEY}
      MCP_SECRET_KEY_PREVIOUS: ${MCP_WEB_SEARCH_SECRET_KEY_PREVIOUS:-}
      MCP_JWT_KEY_ID: ${MCP_WEB_SEARCH_KEY_ID:-web-search-v1}
      MCP_JWT_PREVIOUS_KEY_ID: ${MCP_WEB_SEARCH_PREVIOUS_KEY_ID:-}
      MCP_JWT_AUDIENCE: ${MCP_WEB_SEARCH_JWT_AUDIENCE:-growen-mcp-web-search}
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-60}
      MCP_RATE_LIMIT_BACKEND: redis
      MCP_TOKEN_REVOCATION_BACKEND: redis
      MCP_RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      MCP_JWT_MAX_TTL_SECONDS: ${MCP_JWT_MAX_TTL_SECONDS:-600}
      MCP_JWT_ISSUER: ${MCP_JWT_ISSUER:-growen-api}
      MCP_PROTOCOL_VERSION: ${MCP_PROTOCOL_VERSION:-2025-11-25}
      MCP_LEGACY_RPC_ENABLED: ${MCP_LEGACY_RPC_ENABLED:-0}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:8102:8002"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - egress
volumes:
  pgdata:
  redis_data:
networks:
  backend:
    internal: true
  # Puente exclusivo para bindings loopback de infraestructura local.
  # Los puertos de cada servicio continúan limitados a 127.0.0.1.
  host_access:
    driver: bridge
  egress:
    driver: bridge
